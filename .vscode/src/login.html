<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Entrar</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/.vscode/src/cadastro.css">

    <!-- Overlay styles (copiado leve do PerfilUsuario) -->
    <style>
    .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);z-index:99999}
    .overlay .popup{background:#fff;padding:18px 22px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);max-width:90%;text-align:center}
    .popup.erro p{color:#d60000;font-weight:600;margin:0}
    .overlay.ativo{display:flex;animation:fadeIn .18s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    </style>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<header>
    <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
</header>

<main>
    <h2>Entrar</h2>

    <form id="formLogin" novalidate>

        <!-- MENSAGEM -->
        <div id="mensagem" class="mensagem"></div>

        <!-- OVERLAY DE ERRO (mensagem 'bonitinha' igual ao perfil) -->
        <div id="mensagem-erro-login" class="overlay" style="display:none">
            <div class="popup erro">
                <p>Email e/ou senha incorreto(s) ❌</p>
            </div>
        </div>

        <!-- EMAIL -->
        <div class="campo">
            <label for="email">Email</label>
            <div class="input-container">
                <input type="text" name="email" id="email" placeholder="seuemail@email.com">
                <span id="icon-email"></span>
            </div>
            <div class="erro-texto" id="erro-email"></div>
        </div>

        <!-- SENHA -->
        <div class="campo">
            <label for="senha">Senha</label>
            <div class="senha-container input-container">
                <input type="password" id="senha" placeholder="Digite sua senha">
                <i class="fa fa-eye toggle-senha" onclick="toggleSenhaLogin(this)"></i>
                <span id="icon-senha"></span>
            </div>
            <div class="erro-texto" id="erro-senha"></div>
        </div>

        <!-- BOTÕES -->
        <button type="submit">
            Entrar
        </button>

        <button type="button" onclick="window.location.href='/.vscode/src/cadastrese.html'">
            Não tenho conta
        </button>

        <button type="button" onclick="window.location.href='/.vscode/src/esquecesenha.html'">
            Esqueci minha senha
        </button>
    </form>
</main>

    <div id="sessionModal" class="session-modal">
    <div class="session-box">
        <h2>Sessão expirada</h2>
        <p>Você ficou inativo por muito tempo.<br>Faça login novamente para continuar.</p>
        <button onclick="fecharModal()">Voltar ao login</button>
    </div>
    </div>

<script src="/.vscode/src/login.js"></script>
<script src="/.vscode/src/session.js"></script>

</body>
</html>
