<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lixie - Ranking</title>
  <link rel="stylesheet" href="ranking.css">
  <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

 <header>
        <div class="header-container">
            <a href="#" class="logo-link">
                <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
            </a>

            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <nav class="navbar" id="navbar">
                <a href="/.vscode/src/cadastrese.html" class="nav-link active">Home</a>
                <a href="/.vscode/src/cadastrese.html" class="nav-link">Ranking</a>
                <a href="/.vscode/src/cadastrese.html" class="nav-link">Registrar Reciclagem</a>
                <a href="/.vscode/src/cadastrese.html" class="nav-link">Mapa de Coleta</a>
                <a href="/.vscode/src/cadastrese.html" class="nav-link">Recompensas</a>
            </nav>

            <button class="btn-auth" onclick="window.location.href='/.vscode/src/cadastrese.html'">
                <i class="fas fa-user"></i> Cadastre-se
            </button>
        </div>
    </header>

  <div class="container">

    <div class="title">
      <h1>Ranking de Recicladores</h1>
      <p>Veja quem está no topo do ranking de reciclagem!</p>
    </div>

    <div class="grid">

      <!-- LEFT -->
      <div class="card" id="ranking-lista">
        <h2>Top Recicladores</h2>


      </div>

      <!-- RIGHT -->
      <div>

        <div class="card" id="progresso-usuario">
          <h2>Seu Progresso</h2>

          <p class="progress-text">
          Carregando..
          </p>

          <div class="progress-bar">
            <div class="progress"></div>
        </div>
      </div>

        <div class="info-box">
          <img src="/.vscode/src/img/sinal-de-reciclagem.png" alt="reciclagem" class="reciclagem-img"> 12 reciclagens essa semana
        </div>

        <div class="info-box">
          <img src="/.vscode/src/img/presente.png" alt="presente" class="presente-img">   3 recompensas ganhas
        </div>

        <button class="btn btn-green">Ver recompensas</button>
        <button class="btn btn-green">Dicas de reciclagem</button>

      </div>

    </div>

  </div>


  <script src="ranking.js"></script>


</body>
</html>
