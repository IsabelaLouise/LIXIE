<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lixie - Ranking</title>
  <link rel="stylesheet" href="ranking.css">
  <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header>
        <div class="header-container">
            <a href="/.vscode/src/homeLogado.html" class="logo-link">
                <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
            </a>

            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <nav class="navbar" id="navbar">
                <a href="/.vscode/src/homeLogado.html" class="nav-link">Home</a>
                <a href="/.vscode/src/ranking.html" class="nav-link active">Ranking</a>
                <a href="/.vscode/src/registrarReciclagem.html" class="nav-link">Registrar Reciclagem</a>
                <a href="#" class="nav-link">Mapa de Coleta</a>
                <a href="#" class="nav-link">Recompensas</a>
            </nav>

            <a href="/.vscode/src/PerfilUsuario.html" class="profile-link">
                <img id="fotoHome" class="profile" src="img/avatar.png">
            </a>
        </div>
    </header>

  <div class="container">

    <div class="title">
      <h1>Ranking de Recicladores</h1>
      <p>Veja quem está no topo do ranking de reciclagem!</p>
    </div>

    <div class="grid">

      <!-- LEFT -->
      <div class="card" id="ranking-lista">
        <h2>Top Recicladores</h2>


      </div>

      <!-- RIGHT -->
      <div>

        <div class="card">
          <h2>Seu Progresso</h2>
          <p>Você está em: <strong>12º Lugar</strong></p>
          <p><strong>4560 Pontos</strong></p>

          <div class="progress-bar">
            <div class="progress"></div>
          </div>
        </div>

        <div class="info-box">
          <img src="/.vscode/src/img/sinal-de-reciclagem.png" alt="reciclagem" class="reciclagem-img"> 12 reciclagens essa semana
        </div>

        <div class="info-box">
          <img src="/.vscode/src/img/presente.png" alt="presente" class="presente-img">   3 recompensas ganhas
        </div>

        <button class="btn btn-green">Ver recompensas</button>
        <button class="btn btn-orange">Dicas de reciclagem</button>

      </div>

    </div>

  </div>


  <script src="ranking.js"></script>

   <script>
        // MENU MOBILE TOGGLE
        const menuToggle = document.getElementById('menuToggle');
        const navbar = document.getElementById('navbar');
        const navLinks = document.querySelectorAll('.nav-link');

        // Toggle menu ao clicar no botão
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                navbar.classList.toggle('active');
                menuToggle.classList.toggle('active');
            });
        }

        // Fechar menu ao clicar em um link
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                navbar.classList.remove('active');
                menuToggle.classList.remove('active');
            });
        });

        // Fechar menu ao redimensionar para desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                navbar.classList.remove('active');
                menuToggle.classList.remove('active');
            }
        });
    </script>

</body>
</html>
