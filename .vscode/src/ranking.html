<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lixie - Ranking</title>
  <link rel="stylesheet" href="ranking.css">
  <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header>
    <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">

    <nav>
      <a href="#" class="active">Ranking</a>
      <a href="#">Mapa de Coleta</a>
      <a href="#">Recompensas</a>
      <a href="#">Registrar reciclagem</a>
    </nav>

    <a href="#" class="profile"></a>
  </header>

  <div class="container">

    <div class="title">
      <h1>Ranking de Recicladores</h1>
      <p>Veja quem está no topo do ranking de reciclagem!</p>
    </div>

    <div class="grid">

      <!-- LEFT -->
      <div class="card" id="ranking-lista">
        <h2>Top Recicladores</h2>


      </div>

      <!-- RIGHT -->
      <div>

        <div class="card">
          <h2>Seu Progresso</h2>
          <p>Você está em: <strong>12º Lugar</strong></p>
          <p><strong>4560 Pontos</strong></p>

          <div class="progress-bar">
            <div class="progress"></div>
          </div>

          <p>Próximo objetivo: 5000 pontos</p>
        </div>

        <div class="info-box">
          ♻️ 12 reciclagens essa semana
        </div>

        <div class="info-box">
          🎁 3 recompensas ganhas
        </div>

        <button class="btn btn-green">Ver recompensas</button>
        <button class="btn btn-orange">Dicas de reciclagem</button>

      </div>

    </div>

  </div>

  <script src="ranking.js"></script>
</body>
</html>
