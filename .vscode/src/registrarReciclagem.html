<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Reciclagem</title>
    <link rel="stylesheet" href="/.vscode/src/home.css">
    <link rel="stylesheet" href="registrarReciclagem.css">
</head>

<header>
    <div class="header-container">
      <a href="/.vscode/src/homeLogado.html" class="logo-link">
        <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
      </a>

      <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </button>


      <nav class="navbar" id="navbar">
        <a href="/.vscode/src/homeLogado.html" class="nav-link">Home</a>
        <a href="/.vscode/src/ranking.html" class="nav-link">Ranking</a>
        <a href="/.vscode/src/registrarReciclagem.html" class="nav-link active">Registrar Reciclagem</a>
        <a href="#" class="nav-link">Mapa de Coleta</a>
        <a href="#" class="nav-link">Recompensas</a>
      </nav>

      <a href="/.vscode/src/PerfilUsuario.html" class="profile-link">
        <div class="profile"></div>
      </a>
    </div>
  </header>
  
<body>

<div class="container">

  <!-- 🔥 ESQUERDA: MATERIAIS -->
  <div id="materiais-container">
    <h2>Materiais</h2>

    <div id="materiais">
      <button type="button" data-tipo="plastico"><img src="/.vscode/src/img/plastico.png"> Plástico</button>
      <button type="button" data-tipo="papel"><img src="/.vscode/src/img/papel.png"> Papel</button>
      <button type="button" data-tipo="vidro"><img src="/.vscode/src/img/vidro.png"> Vidro</button>
      <button type="button" data-tipo="metal"><img src="/.vscode/src/img/metal.png"> Metal</button>
      <button type="button" data-tipo="organico"><img src="/.vscode/src/img/organico.png"> Orgânico</button>
      <button type="button" data-tipo="pilhas"><img src="/.vscode/src/img/bateria.png"> Pilhas</button>
      <button type="button" data-tipo="eletronico"><img src="/.vscode/src/img/eletronico.png"> Eletrônicos</button>
      <button type="button" data-tipo="tampinha"><img src="/.vscode/src/img/tampinha.png"> Tampinha</button>
      <button type="button" data-tipo="cartela"><img src="/.vscode/src/img/cartela.png"> Cartela</button>
      <button type="button" data-tipo="capsula"><img src="/.vscode/src/img/cafe.png"> Cápsula</button>
    </div>
  </div>

<div class="lado-direito">

  <!-- FORM -->
  <form id="formReciclagem">

    <h2>Registrar Reciclagem</h2>

    <div class="linha">
      <input type="number" id="quantidade" placeholder="Quantidade" required>

      <select id="unidade">
        <option value="kg">kg (Kilogramas)</option>
        <option value="g">g (Gramas)</option>
        <option value="ton">ton (Toneladas)</option>
        <option value="un">Unidades</option>
      </select>
    </div>

    <p id="resultado"></p>

    <label>Digite o CEP:</label>
    <input type="text" id="cep" placeholder="Digite o CEP">

    <label>Comprove com uma foto:</label>
    <input type="file" id="foto" accept="image/*">

  </form>

  <!-- BOTÃO -->
  <button type="submit" form="formReciclagem">
    Registrar
  </button>

  <!-- 👇 PAINEL AGORA EMBAIXO -->
  <div id="painelPontos">
    <h3>Seu Progresso</h3>
    <p id="nivel">Nível: Iniciante 🌱</p>
    <p id="pontos">Pontos: 0</p>

    <div id="barraContainer">
      <div id="barraProgresso"></div>
    </div>
  </div>

</div>

<script src="registrarReciclagem.js"></script>

<script>
    // MENU MOBILE TOGGLE
    const menuToggle = document.getElementById('menuToggle');
    const navbar = document.getElementById('navbar');
    const navLinks = document.querySelectorAll('.nav-link');

    // Toggle menu ao clicar no botão
    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            navbar.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });
    }

    // Fechar menu ao clicar em um link
    navLinks.forEach(link => {
        link.addEventListener('click', () => {
            navbar.classList.remove('active');
            menuToggle.classList.remove('active');
        });
    });

    // Fechar menu ao redimensionar para desktop
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            navbar.classList.remove('active');
            menuToggle.classList.remove('active');
        }
    });
</script>

</body>
</html>
