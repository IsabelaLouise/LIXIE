<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cadastre-se</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/.vscode/src/PerfilUsuario.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
    </header>
    <main>
        <h2>Perfil do Usuário</h2>

        
        <div class="perfil-container">  
            <a href="homeLogado.html" id="bnt-fechar">X</a>
            <form id="formPerfil" novalidate>
                <div class="grid-container">

                    <!-- FT PERFIL -->
                    <div class="campo" id="campo-1">
                        <img src="/.vscode/src/img/avatar.png" alt="Avatar do usuário" class="avatar-img" id="avatar">
                        <label for="foto-perfil">Alterar Foto</label>
                        <input type="file" accept="image/jpeg,image/png" name="foto" class="input-file" id="foto-perfil">
                    </div>

                    <!-- NOME -->
                    <div class="campo" id="campo-2">
                        <label for="nome">Nome</label>
                        <div class="input-container">
                            <input type="text" name="nome" id="nome" placeholder="Seu nome">
                            <span id="icon-nome"></span>
                        </div>
                        <div class="erro-texto" id="erro-nome"></div>
                    </div>

                    <!-- EMAIL -->
                    <div class="campo" id="campo-3">
                        <label for="email">Email</label>
                        <div class="input-container">
                            <input type="text" name="email" id="email" disabled>
                            <span id="icon-email"></span>
                        </div>
                        <div class="erro-texto" id="erro-email"></div>
                    </div>

                    <!-- TEL -->
                    <div class="campo" id="campo-4">
                        <label for="telefone">Telefone</label>
                        <div class="input-container">
                            <input type="text" name="telefone" id="tel" placeholder="Seu telefone">
                            <span id="icon-tel"></span>
                        </div>
                        <div class="erro-texto" id="erro-tel"></div>
                    </div>

                    <!-- DATA NASCIMENTO -->
                    <div class="campo" id="campo-5">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <div class="input-container">
                            <input type="date" name="dataNascimento" id="dataNascimento" disabled>
                            <span id="icon-dataNascimento"></span>
                        </div>
                        <div class="erro-texto" id="erro-dataNascimento"></div>
                    </div>           

                    <!-- CEP -->
                    <div class="campo" id="campo-6">
                        <label for="cep">CEP</label>
                        <div class="input-container">
                            <input type="text" name="cep" id="cep" placeholder="Seu CEP">
                            <span id="icon-cep"></span>
                        </div>
                        <div class="erro-texto" id="erro-cep"></div>
                    </div>

                    <!-- RUA -->
                    <div class="campo" id="campo-7">
                        <label for="rua">Rua</label>
                        <div class="input-container">
                            <input type="text" name="rua" id="rua" placeholder="Sua rua" disabled>
                            <span id="icon-rua"></span>
                        </div>
                        <div class="erro-texto" id="erro-rua"></div>
                    </div>

                    <!-- CIDADE -->
                    <div class="campo" id="campo-8">
                        <label for="cidade">Cidade</label>
                        <div class="input-container">
                            <input type="text" name="cidade" id="cidade" placeholder="Sua cidade"disabled>
                            <span id="icon-cidade"></span>
                        </div>
                        <div class="erro-texto" id="erro-cidade"></div>
                    </div>

                    <!-- ESTADO -->
                    <div class="campo" id="campo-9">
                        <label for="estado">Estado</label>
                        <div class="input-container">
                            <input type="text" name="estado" id="estado" placeholder="Seu estado"disabled>
                            <span id="icon-estado"></span>
                        </div>
                        <div class="erro-texto" id="erro-estado"></div>
                    </div>

                    <!-- NUM -->
                    <div class="campo" id="campo-10">
                        <label for="numero">Num</label>
                        <div class="input-container">
                            <input type="text" name="numero" id="num" placeholder="Número de sua casa">
                            <span id="icon-num"></span>
                        </div>
                        <div class="erro-texto" id="erro-num"></div>
                    </div>

                    <!-- COMPLEMENTO -->
                    <div class="campo" id="campo-11">
                        <label for="complemento">Complemento</label>
                        <div class="input-container">
                            <input type="text" name="complemento" id="complemento" placeholder="Complemento de sua casa">
                            <span id="icon-complemento"></span>
                        </div>
                        <div class="erro-texto" id="erro-complemento"></div>
                    </div>

                    <!-- BTNS -->
                    <div class="campo" id="campo-13">
                        <button type="button" class="btn-alterar-senha">Alterar Senha</button>
                        <button type="submit" class="btn-salvar" id="Submit-Perfil">Salvar Alterações</button>
                        <button type="button" class="btn-apagar-conta" id="btn-apagar-conta">Apagar Conta</button>
                    </div>

                </div>
            </form>

            <div id="mensagem-sucesso" class="overlay">
                <div class="popup">
                    <p>Alterações salvas com sucesso ✅</p>
                </div>
            </div>

            <div id="mensagem-nada" class="overlay">
                <div class="popup">
                    <p>Nenhuma alteração foi feita ⚠️</p>
                </div>
            </div>

            <dialog id="popUp-apagar">
                <button id="btn-fechar-modal">X</button>

                <h3>Tem certeza que deseja apagar sua conta?</h3>
                <br>
                <p>Essa ação é irreversível e todos os seus dados serão perdidos.
                    Se sim porfavor insira sua senha para confirmar sua identidade como dono da conta.</p>
                <br>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="senha-container input-container">
                        <input type="password" id="senha" placeholder="Digite sua senha">
                        <i class="fa fa-eye toggle-senha" onclick="toggleSenhaLogin(this)"></i>
                        <span id="icon-senha"></span>
                    </div>
                    <div class="erro-texto" id="erro-senha"></div>
                </div>
                <div class="botoes-dialog">
                    <button id="confirmar-apagar" class="btn-confirmar">Apagar minha conta</button>
                </div>
            </dialog>

            <dialog id="popUp-trocar-senha">
                
            </dialog>
        </div>

    </main>

</body>

<script src="/.vscode/src/PerfilUsuario.js"></script>
</html>
