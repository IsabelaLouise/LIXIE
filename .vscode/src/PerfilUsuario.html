<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cadastre-se</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/.vscode/src/PerfilUsuario.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
    </header>
    <main>
        <h2>Perfil do Usuário</h2>

        
        <div class="perfil-container">  
            <a href="homeLogado.html" id="bnt-fechar">X</a>
            <form id="formPerfil" novalidate>
                
                <div class="grid-container">
                    

                    <!-- FT PERFIL -->
                    <div class="campo" id="campo-1">
                        <img src="/.vscode/src/img/avatar.png" alt="Avatar do usuário" class="avatar-img" id="avatar">
                        <label for="foto-perfil">Alterar Foto</label>
                        <input type="file" accept="image/jpeg,image/png" class="input-file" id="foto-perfil">
                    </div>

                    <!-- NOME -->
                    <div class="campo" id="campo-2">
                        <label for="nome">Nome</label>
                        <div class="input-container">
                            <input type="text" name="nome" id="nome" placeholder="Nome da pessoa logada">
                            <span id="icon-nome"></span>
                        </div>
                        <div class="erro-texto" id="erro-nome"></div>
                    </div>

                    <!-- EMAIL -->
                    <div class="campo" id="campo-3">
                        <label for="email">Email</label>
                        <div class="input-container">
                            <input type="text" name="email" id="email" disabled>
                            <span id="icon-email"></span>
                        </div>
                        <div class="erro-texto" id="erro-email"></div>
                    </div>

                    <!-- TEL -->
                    <div class="campo" id="campo-4">
                        <label for="tel">Telefone</label>
                        <div class="input-container">
                            <input type="text" name="tel" id="tel" placeholder="Telefone da pessoa logada">
                            <span id="icon-tel"></span>
                        </div>
                        <div class="erro-texto" id="erro-tel"></div>
                    </div>

                    <!-- DATA NASCIMENTO -->
                    <div class="campo" id="campo-5">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <div class="input-container">
                            <input type="date" name="dataNascimento" id="dataNascimento" placeholder="Data de nascimento da pessoa logada"disabled>
                            <span id="icon-dataNascimento"></span>
                        </div>
                        <div class="erro-texto" id="erro-dataNascimento"></div>
                    </div>           

                    <!-- CEP -->
                    <div class="campo" id="campo-6">
                        <label for="cep">CEP</label>
                        <div class="input-container">
                            <input type="text" name="cep" id="cep" placeholder="CEP da pessoa logada">
                            <span id="icon-cep"></span>
                        </div>
                        <div class="erro-texto" id="erro-cep"></div>
                    </div>

                    <!-- RUA -->
                    <div class="campo" id="campo-7">
                        <label for="rua">Rua</label>
                        <div class="input-container">
                            <input type="text" name="rua" id="rua" placeholder="Rua da pessoa logada" disabled>
                            <span id="icon-rua"></span>
                        </div>
                        <div class="erro-texto" id="erro-rua"></div>
                    </div>

                    <!-- CIDADE -->
                    <div class="campo" id="campo-8">
                        <label for="cidade">Cidade</label>
                        <div class="input-container">
                            <input type="text" name="cidade" id="cidade" placeholder="Cidade da pessoa logada"disabled>
                            <span id="icon-cidade"></span>
                        </div>
                        <div class="erro-texto" id="erro-cidade"></div>
                    </div>

                    <!-- ESTADO -->
                    <div class="campo" id="campo-9">
                        <label for="estado">Estado</label>
                        <div class="input-container">
                            <input type="text" name="estado" id="estado" placeholder="Estado da pessoa logada"disabled>
                            <span id="icon-estado"></span>
                        </div>
                        <div class="erro-texto" id="erro-estado"></div>
                    </div>

                    <!-- NUM -->
                    <div class="campo" id="campo-10">
                        <label for="num">Num</label>
                        <div class="input-container">
                            <input type="text" name="num" id="num" placeholder="Número da casa da pessoa logada">
                            <span id="icon-num"></span>
                        </div>
                        <div class="erro-texto" id="erro-num"></div>
                    </div>

                    <!-- COMPLEMENTO -->
                    <div class="campo" id="campo-11">
                        <label for="complemento">Complemento</label>
                        <div class="input-container">
                            <input type="text" name="complemento" id="complemento" placeholder="Complemento da casa da pessoa logada">
                            <span id="icon-complemento"></span>
                        </div>
                        <div class="erro-texto" id="erro-complemento"></div>
                    </div>
                    
                    <!-- SENHA -->
                    <div class="campo" id="campo-12">
                        <label for="senha">Senha</label>
                        <div class="input-container">
                            <input type="password" name="senha" id="senha" placeholder="Senha criptografada da pessoa logada" disabled>
                            <span id="icon-senha"></span>
                        </div>
                        <div class="erro-texto" id="erro-senha"></div>
                        <button type="button" class="btn-alterar-senha">Alterar Senha</button>
                    </div>

                    <div class="campo" id="campo-13">
                        <button type="submit" class="btn-salvar" id="Submit-Perfil">Salvar Alterações</button>
                    </div>

                </div>
            </form>


        </div>
    </main>

</body>

<script src="PerfilUsuario.js"></script>
</html>
