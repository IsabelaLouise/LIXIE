<!DOCTYPE html>
<html>
<head>
  <title>Mapa de Coleta</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="MapaDeColeta.css">
  
</head>
<body>

  <header>
        <div class="header-container">
            <a href="/.vscode/src/homeLogado.html" class="logo-link">
                <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
            </a>

            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <nav class="navbar" id="navbar">
                <a href="/.vscode/src/homeLogado.html" class="nav-link active">Home</a>
                <a href="/.vscode/src/ranking.html" class="nav-link">Ranking</a>
                <a href="/.vscode/src/registrarReciclagem.html" class="nav-link">Registrar Reciclagem</a>
                <a href="#" class="nav-link">Mapa de Coleta</a>
                <a href="#" class="nav-link">Recompensas</a>
            </nav>

            <a href="/.vscode/src/PerfilUsuario.html" class="profile-link">
                <img id="fotoHome" class="profile" src="img/avatar.png">
            </a>
        </div>
    </header>

    <main class="page-content">
      <section class="map-section">
        <div class="page-title">
          <h1>Mapa de Coleta</h1>
          <p>Encontre pontos de coleta próximos de você e ajude a transformar o futuro.</p>
        </div>

        <div class="map-layout">
          <div class="map-card">
            <div class="map-search">
              <input type="text" placeholder="Buscar endereço ou bairro">
            </div>
            <div id="map"></div>
            <div class="map-info">
              <span>37 pontos de coleta encontrados</span>
              <small>Mostrando todos os pontos</small>
            </div>
          </div>

          <aside class="filters-card">
            <h2>Filtros</h2>
            <!-- daqui a pouco eu adiciono os filtros reais -->
          </aside>
        </div>
      </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // Criar mapa
  const map = L.map('map').setView([-25.43, -49.27], 13); // Curitiba

  // Adicionar mapa base
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

</script>

<script src="/.vscode/src/session.js"></script>

</body>
</html>
