<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lixie - Mapa de Coleta</title>

  <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
   <link rel="stylesheet" href="MapaDeColeta.css">
</head>

<body>

  <!-- HEADER -->

 <header>
        <div class="header-container">
            <a href="/.vscode/src/homeLogado.html" class="logo-link">
                <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
            </a>

            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <nav class="navbar" id="navbar">
                <a href="/.vscode/src/homeLogado.html" class="nav-link ">Home</a>
                <a href="/.vscode/src/ranking.html" class="nav-link">Ranking</a>
                <a href="/.vscode/src/registrarReciclagem.html" class="nav-link">Registrar Reciclagem</a>
                <a href="/.vscode/src/MapaDeColeta.html" class="nav-link active">Mapa de Coleta</a>
                <a href="#" class="nav-link">Recompensas</a>
            </nav>

            <a href="/.vscode/src/PerfilUsuario.html" class="profile-link">
                <img id="fotoHome" class="profile" src="img/avatar.png">
            </a>
        </div>
    </header>

  <!-- MAIN -->

  <div class="container">

    <!-- LEFT -->

    <div class="left">

      <div class="title">
        <span class="material-icons">location_on</span>
        <h1>Mapa de Coleta</h1>
      </div>

      <p class="subtitle">
        Encontre pontos de coleta próximos de você e ajude a transformar o futuro.
      </p>

      <!-- MAP -->

      <div class="map-container">

        

        <div id="map"></div>

      </div>

      <!-- INFO -->

      <div class="info-card">

        <div class="info-left">

          <div class="pin">
            <span class="material-icons">place</span>
          </div>

          <div class="info-text">
            <h3>10 pontos de coleta encontrados</h3>
            <p>Mostrando todos os pontos</p>
          </div>

        </div>

      

      </div>

    </div>

    <!-- FILTERS -->

    <div class="filters">

      <h2>Filtros</h2>

      <div class="filter-group">

        <h3>Material reciclável</h3>

        <div class="materials">

          <div id="materiais">
      <button class="material-btn" data-tipo="plastico"><img src="/.vscode/src/img/plastico.png"> Plástico</button>
      <button class="material-btn" data-tipo="papel"><img src="/.vscode/src/img/papel.png"> Papel</button>
      <button class="material-btn" data-tipo="vidro"><img src="/.vscode/src/img/vidro.png"> Vidro</button>
      <button class="material-btn" data-tipo="metal"><img src="/.vscode/src/img/metal.png"> Metal</button>
      <button class="material-btn" data-tipo="organico"><img src="/.vscode/src/img/organico.png"> Orgânico</button>
      <button class="material-btn" data-tipo="pilhas"><img src="/.vscode/src/img/bateria.png"> Pilhas</button>
      <button class="material-btn" data-tipo="eletronico"><img src="/.vscode/src/img/eletronico.png"> Eletrônicos</button>
      <button class="material-btn" data-tipo="tampinha"><img src="/.vscode/src/img/tampinha.png"> Tampinha</button>
      <button class="material-btn" data-tipo="cartela"><img src="/.vscode/src/img/cartela.png"> Cartela</button>
      <button class="material-btn" data-tipo="capsula"><img src="/.vscode/src/img/cafe.png"> Cápsula</button>
    </div>

        </div>

      </div>

      <div class="filter-group">

        <h3>Bairro</h3>

        <select id="bairroSelect">
          <option>Todos os bairros</option>
          <option>Centro</option>
          <option>Boqueirão</option>
          <option>Água Verde</option>
          <option>Santa Felicidade</option>
          <option>Portão</option>
          <option>Batel</option>
          <option>Rebouças</option>

        </select>

      </div>


      <div class="filter-group">

        

      </div>

      <button class="apply-btn">
        Aplicar filtros
      </button>

      <button class="clear-btn">
        Limpar filtros
      </button>

    </div>

  </div>

  <script src="MapaDeColeta.js"></script>
  <script src="verificacao.js"></script>
  <script src=".vscode/src/session.js"></script>

</body>
</html>
