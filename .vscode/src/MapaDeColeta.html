<body>

  <header>
        <div class="header-container">
            <a href="/.vscode/src/homeLogado.html" class="logo-link">
                <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">

            <button class="menu-toggle" id="menuToggle">

<div id="map"></div>



<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // Criar mapa
  const map = L.map('map').setView([-25.43, -49.27], 13); // Curitiba

  // Adicionar mapa base
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

</script>

</body>
