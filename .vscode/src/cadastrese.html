<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cadastre-se</title>

    <link rel="stylesheet" href="/.vscode/src/cadastro.css">

    <script src="/.vscode/src/script.js"></script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<header>
    <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
</header>
<!--  -->
<main>
    <h2>Cadastre-se</h2>

    <form id="formCadastro" action="http://localhost:8000/cadastrar" method="POST">

        <!-- MENSAGEM -->
        <div id="mensagem" class="mensagem"></div>

        <div class="stepper">
            <div class="step active">1<br><span>Email</span></div>
            <div class="step">2<br><span>Dados</span></div>
            <div class="step">3<br><span>CEP</span></div>
            <div class="step">4<br><span>Senha</span></div>
        </div>

        <div class="form-page active" id="page-email">
            <div class="campo">
                <label for="email">Email</label>
                <div class="input-container">
                    <input type="text" name="email" id="email" placeholder="seuemail@email.com">
                    <span id="icon-email"></span>
                </div>
                <div class="erro-texto" id="erro-email"></div>
            </div>

            <div class="button-row">
                <button type="button" class="btn-next" id="page1Next">Próximo</button>
            </div>
        </div>

        <div class="form-page" id="page-dados">
            <div class="campo">
                <label for="nome">Nome</label>
                <div class="input-container">
                    <input type="text" name="nome" id="nome" placeholder="Digite seu nome" autocomplete="name">
                    <span id="icon-nome"></span>
                </div>
                <div class="erro-texto" id="erro-nome"></div>
            </div>

            <div class="campo">
                <label for="data_nasc">Data de nascimento</label>
                <div class="input-container">
                    <input type="text" name="data_nasc" id="data_nasc" placeholder="DD/MM/AAAA">
                    <span id="icon-data"></span>
                </div>
                <div class="erro-texto" id="erro-data"></div>
            </div>

                <div class="campo">
                <label for="numero">Telefone</label>
                <div class="input-container">
                    <!-- name alterado para 'telefone' para casar com o backend; id permanece 'numero' para as máscaras/validações JS -->
                    <input type="tel" inputmode="numeric" maxlength="15" name="telefone" id="numero" placeholder="(00) 00000-0000">
                    <span id="icon-numero"></span>
                </div>
                <div class="erro-texto" id="erro-numero"></div>
            </div>

            <div class="button-row">
                <button type="button" class="btn-prev" id="page2Prev">Voltar</button>
                <button type="button" class="btn-next" id="page2Next">Próximo</button>
            </div>
        </div>

        <div class="form-page" id="page-cep">
            <div class="campo">
                <label for="cep">CEP</label>
                <div class="input-container">
                    <input type="text" name="cep" id="cep" placeholder="00000-000" maxlength="9">
                    <span id="icon-cep"></span>
                </div>
                <div class="erro-texto" id="erro-cep"></div>
            </div>

            <div class="campo">
                <label for="rua">Rua</label>
                <input type="text" name="rua" id="rua" readonly>
            </div>

            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" name="cidade" id="cidade" readonly>
            </div>

            <div class="campo">
                <label for="estado">Estado</label>
                <input type="text" name="estado" id="estado" readonly>
            </div>

            <div class="campo">
                <label for="numeroCasa">Número</label>
                <input type="text" name="numeroCasa" id="numeroCasa" placeholder="Número da casa">
            </div>

            <div class="campo">
                <label for="complemento">Complemento</label>
                <input type="text" name="complemento" id="complemento" placeholder="Complemento">
            </div>

            <div class="button-row">
                <button type="button" class="btn-prev" id="page3Prev">Voltar</button>
                <button type="button" class="btn-next" id="page3Next">Próximo</button>
            </div>
        </div>

        <div class="form-page" id="page-senha">
            <div class="campo">
                <label for="senha">Senha</label>
                <div class="senha-container input-container">
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
                    <i class="fa fa-eye toggle-senha" onclick="toggleSenha()"></i>                    
                    <span id="icon-senha"></span>
                </div>
                <div class="erro-texto" id="erro-senha"></div>

                <div class="requisitos-senha" id="requisitosSenha">
                    <p id="req-maiuscula">❌ Letra maiúscula</p>
                    <p id="req-minuscula">❌ Letra minúscula</p>
                    <p id="req-numero">❌ Número</p>
                    <p id="req-especial">❌ Caractere especial</p>
                    <p id="req-tamanho">❌ Mínimo 8 caracteres</p>
                </div>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <div class="senha-container input-container">
                    <input type="password" name="senhaConferencia" id="confirmarSenha" placeholder="Repita sua senha">
                    <i class="fa fa-eye toggle-senha" onclick="toggleSenha()"></i>                    
                    <span id="icon-confirmar"></span>
                </div>
                <div class="erro-texto" id="erro-confirmar"></div>
            </div>

            <div class="button-row">
                <button type="button" class="btn-prev" id="page4Prev">Voltar</button>
                <button type="submit">Cadastrar</button>
            </div>
        </div>

        <button type="button" onclick="window.location.href='/.vscode/src/login.html'">
            Já tenho conta
        </button>

    </form>
</main>

        <!-- OVERLAY: mensagem de conta criada (igual estilo do perfil) -->
        <div id="mensagem-cadastrado" class="overlay">
            <div class="popup">
                <p>Conta criada com sucesso</p>
            </div>
        </div>

        <script src="/.vscode/src/script.js"></script>

</body>
</html>
