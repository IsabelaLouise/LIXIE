<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin - Usuários</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="verificacao.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/.vscode/src/homeLogado.html" class="logo-link">
                <img src="/.vscode/src/img/logo.png" alt="Lixie" class="logo-img">
            </a>

            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <nav class="navbar" id="navbar">
                <a href="/.vscode/src/adminUsuarios.html" class="nav-link active">Usuários</a>
                <a href="/.vscode/src/adminReciclagens.html" class="nav-link">Reciclagens</a>
            </nav>

            <a href="/.vscode/src/PerfilUsuario.html" class="profile-link">
                <img id="fotoHome" class="profile" src="img/avatar.png">
            </a>
        </div>
    </header>

    <main class="admin-main">
        <div class="admin-container">
            <h2 id="gerenciar">Gerenciar Usuários</h2>
            <div class="admin-table-wrap">
                <table class="admin-table" id="usuariosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Pontos</th>
                            <th>Permissão</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="admin-mensagem-sucesso" class="overlay" style="display:none;">
        <div class="popup">
            <p>Alterações salvas com sucesso</p>
        </div>
    </div>

    <dialog id="dialog-editar-usuario" class="popup-grande">
        <button id="fechar-editar-usuario">X</button>
        <h3>Editar Usuário</h3>
        <form id="form-editar-usuario">
            <div class="campo">
                <label for="edit-nome">Nome</label>
                <input type="text" id="edit-nome" name="nome">
            </div>
            <div class="campo">
                <label for="edit-email">Email</label>
                <input type="text" id="edit-email" name="email" disabled>
            </div>
            <div class="campo">
                <label for="edit-pontos">Pontos</label>
                <input type="number" id="edit-pontos" name="pontos">
            </div>
            <div class="campo">
                <label for="edit-permissao">Permissão</label>
                <select id="edit-permissao" name="permissao">
                    <option value="usuario">Usuario</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="botoes-dialog">
                <button type="button" id="cancelar-editar-usuario">Cancelar</button>
                <button type="submit" id="salvar-editar-usuario" class="btn-confirmar">Salvar</button>
            </div>
        </form>
    </dialog>

    <!-- POPUP EXCLUIR USUÁRIO -->
    <dialog id="dialog-excluir-usuario" class="popup-grande">
        <button id="fechar-excluir-usuario">X</button>

        <h3>Excluir usuário</h3>

        <p class="texto-popup">
            Tem certeza que deseja excluir este usuário?
            Essa ação não poderá ser desfeita.
        </p>

        <div class="botoes-dialog">
            <button type="button" id="cancelar-excluir-usuario">
                Cancelar
            </button>

            <button type="button" id="confirmar-excluir-usuario" class="btn-danger">
                Excluir
            </button>
        </div>
    </dialog>
    <!-- POPUP GLOBAL -->
    <div id="popup-global" class="overlay-popup" style="display: none;">
        <div class="popup-global-box">
            <h3 id="popup-global-titulo">Aviso</h3>

            <p id="popup-global-texto">
                Mensagem aqui
            </p>

            <button id="popup-global-btn">
                Fechar
            </button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="admin.js"></script>
    <script src="verificacaoAdmin.js"></script>
</body>
</html>
