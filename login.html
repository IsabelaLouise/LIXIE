<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Document</title>

<body>
    <header>
        <h2>Logo</h2>
    </header>
    <main>
        <h2>Login</h2>
        <form id="formLogin" action="/login" method="POST">
    <label class="hidden">Email:</label>
            <input type="email" name="email" placeholder="Email*" id="email" required><br><br> 

            <div class="senha-container">
                <input type="password" name="senha" placeholder="Senha*" id="senha" required>
                <span class="toggle-senha" onclick="toggleSenha('senha', this)">🔒</span>
            </div><br><br> 
            <button type="button" onclick="window.location.href='login.html'"> Entrar</button>
            </form>
    </main>
    
</body>
</html>
