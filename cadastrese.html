<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
</head>
<body>
    <header>
        <h2>Logo</h2>
    </header>
    <main>
        <h2>Cadastre-se</h2>
        <form action="/cadastro" method="POST"> 
            <label>Nome:</label><br> 
            <input type="text" name="nome" required><br><br> 

            <label>Data de Nascimento:</label><br> <input type="date" name="data_nasc"><br><br> 

            <label>Email:</label><br> 
            <input type="email" name="email" required><br><br> 

            <label>Senha:</label><br> <input type="password" name="senha" required><br><br> 

            <label>Confirmar Senha:</label><br> <input type="password" name="senha" required><br><br> 
            
            <button type="submit">Cadastrar</button> 
            <p> 
                <a href="login.html">Já tenho conta</a> 
            </p>
        </form>
    </main>
</body>
</html>
