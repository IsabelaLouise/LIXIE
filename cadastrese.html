<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastre-se</title>
</head>
<body>
    <header>
        <h2>Logo</h2>
    </header>
    <main>
        <h2>Cadastre-se</h2>
        <form action="/cadastro" method="POST"> 
            <label class="hidden">Nome:</label><br> 
            <input type="text" placeholder="Nome" required><br><br> 

            <label class="hidden">Data de Nascimento:</label><br> 
            <input name="data_nasc" id="data_nasc" placeholder="Data de Nascimento" required><br><br> 

            <label class="hidden">Telefone:</label><br> 
            <input name="numero" id="numero" placeholder="Número" required><br><br> 

            <label class="hidden">Email:</label><br> 
            <input type="email" name="email" placeholder="Email" required><br><br> 

            <label class="hidden">Senha:</label><br> 
            <input type="password" name="senha" placeholder="Senha" required><br><br> 

            <label class="hidden">Confirmar Senha:</label><br> 
            <input type="password" name="senhaConferencia" placeholder="Confirmar sua senha" required><br><br> 
            
            <button type="submit">Cadastrar</button><br><br> 
            <button type="button" onclick="window.location.href='login.html'"> Já tenho conta </button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
